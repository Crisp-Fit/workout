const HT=[{i:"💧",t:"Drink water before you even pick up a weight. At 250lbs you need more than most."},{i:"🥩",t:"Protein is non-negotiable. Aim for 180-200g/day to preserve muscle while cutting."},{i:"😴",t:"7-8 hours of sleep is doing more for your belly fat than any crunch ever will."},{i:"📅",t:"Consistency over Intensity. Showing up every day at 70% beats skipping workouts."},{i:"📏",t:"Take measurements and photos now. The scale lies — inches and mirror tell the truth."}];
const ST=[{i:"💧",t:"Hydration is huge for women's fat loss. Aim for at least 80oz of water daily."},{i:"🥩",t:"Protein protects your muscle while cutting. Target 130-150g per day."},{i:"🌙",t:"Cortisol directly causes belly fat and love handles. Sleep 7-8 hours — it is training."},{i:"📏",t:"Take waist and hip measurements now plus a photo. The scale will be unreliable as you build muscle."},{i:"🔄",t:"Your energy will vary through your cycle — that is normal. Adjust intensity, never skip entirely."}];
let who='h',d=0;
const chk={h:{},s:{}};
function go(p){
  who=p;d=0;
  document.getElementById('sel').style.display='none';
  document.getElementById('app').style.display='block';
  const h=p==='h';
  document.getElementById('hn').innerHTML=h?'HAYDEN\'S <span style="color:#e8632a">AT-HOME</span> PROGRAM':'SHELBY\'S <span style="color:#c4567a">AT-HOME</span> PROGRAM';
  document.getElementById('hsu').textContent=h?'6 DAYS/WEEK · CUT + TONE · ARMS & CORE':'6 DAYS/WEEK · CUT + TONE · GLUTES & ARMS';
  rT();rA();render();
}
function back(){document.getElementById('app').style.display='none';document.getElementById('sel').style.display='flex';}
function days(){return who==='h'?H:S;}
function render(){
  const D=days(),h=who==='h';
  document.getElementById('tabs').innerHTML=D.map((x,i)=>'<button class="tab '+(i===d?(h?'ah':'as'):'ti')+'" onclick="sd('+i+')">'+x.day.slice(0,3)+'</button>').join('');
  const x=D[d];
  if(x.rest){
    document.getElementById('con').innerHTML='<div class="dh '+(h?'dhh':'dhs')+'"><div class="dht"><div><div class="dls">'+x.day+'</div><h2>'+x.label+'</h2></div><span class="dtag" style="background:'+x.tc+'22;color:'+x.tc+';border:1px solid '+x.tc+'44">'+x.tag+'</span></div><div class="'+(h?'fch':'fcs')+'">'+x.focus+'</div></div><div class="rc '+(h?'rch':'rcs')+'"><div class="re">🛌</div><h3>Complete Rest Day</h3><p>'+x.note+'</p><div class="rj '+(h?'rjh':'rjs')+'"><div class="'+(h?'rjlh':'rjls')+'">TODAY\'S ONLY JOB</div><div class="rjt">'+(h?'Long walk with Shelby. Stretch. Recover. 💪':'Long walk with Hayden. Stretch. Recover. 💪')+'</div></div></div>';
    return;
  }
  const exH=x.ex.map((e,i)=>{
    if(e.hdr) return '<div class="'+(h?'shh':'shs')+'">'+e.n+'</div>';
    const k=d+'-'+i,done=!!chk[who][k];
    return '<div class="ec '+(h?'ech':'ecs')+(e.sub?' sub':'')+(done?' done':'')+'" onclick="tog('+d+','+i+')"><div class="er"><div class="el"><div class="enr"><div class="cc'+(done?' done':'')+'">'+( done?'✓':'')+'</div><span class="en'+(e.sub?' sub':'')+(done?' done':'')+'">'+e.n+'</span></div>'+(e.t?'<div class="etp">'+e.t+'</div>':'')+'</div><div class="ev">'+(e.s?'<div class="'+(h?'esh':'ess')+'">'+e.s+'</div>':'')+(e.w?'<div class="ew">'+e.w+'</div>':'')+'</div></div></div>';
  }).join('');
  document.getElementById('con').innerHTML='<div class="dh '+(h?'dhh':'dhs')+'"><div class="dht"><div><div class="dls">'+x.day+'</div><h2>'+x.label+'</h2></div><span class="dtag" style="background:'+x.tc+'22;color:'+x.tc+';border:1px solid '+x.tc+'44">'+x.tag+'</span></div><div class="'+(h?'fch':'fcs')+'">'+x.focus+'</div></div>'+(x.wu?'<div class="wu '+(h?'wuh':'wus')+'"><span style="font-size:18px">🔥</span><div><div class="wul">WARMUP</div><div class="wut">'+x.wu+'</div></div></div>':'')+'<div class="exs">'+exH+'</div>'+(x.cd?'<div class="wk '+(h?'wkh':'wks')+'"><span style="font-size:18px">🚶</span><div><div class="wkl">DAILY WALK</div><div class="wkt">'+x.cd+'</div></div></div>':'')+'<div class="'+(h?'nbh':'nbs')+'"><div class="'+(h?'nlh':'nls')+'">COACH NOTE</div><div class="nt">'+x.note+'</div></div>';
}
function rT(){
  const tips=who==='h'?HT:ST,tc=who==='h'?'tch':'tcs';
  document.getElementById('tw').innerHTML='<div class="div" style="margin:0 0 12px">THE 20% THAT MATTERS MOST</div><div class="tl">'+tips.map(t=>'<div class="tc '+tc+'"><span class="ti2">'+t.i+'</span><span class="tt">'+t.t+'</span></div>').join('')+'</div>';
}
function rA(){
  const a=who==='h'?'aih':'ais';
  const items=["5lb Dumbbells","8lb Dumbbells","10lb Dumbbells","15lb Dumbbells","20lb Dumbbells","10lb Barbell","15lb Barbell","20lb Barbell","Your Bodyweight"];
  document.getElementById('aw').innerHTML='<div class="div" style="margin:16px 0 12px">YOUR ARSENAL</div><div class="ag">'+items.map(it=>'<div class="'+a+'">✓ '+it+'</div>').join('')+'</div>';
}
function sd(i){d=i;render();window.scrollTo({top:0,behavior:'smooth'});}
function tog(di,ei){const k=di+'-'+ei;chk[who][k]=!chk[who][k];render();}
</script>
